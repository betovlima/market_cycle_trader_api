name: Apply API v10.8.5 disable asset-state stage

on:
  push:
    branches:
      - fix/10.8.5-disable-asset-state-stage

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v10.8.5 applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10.8.5-disable-asset-state-stage
          fetch-depth: 0

      - name: Remove active Asset State Clustering hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('src/market_cycle_trader_api/core/config.py', 'API_VERSION = "10.8.4"', 'API_VERSION = "10.8.5"')
          replace_once('pyproject.toml', 'version = "10.8.4"', 'version = "10.8.5"')

          main = Path('src/market_cycle_trader_api/main.py')
          text = main.read_text(encoding='utf-8')
          active_hook = '''from .services.strategy_research_asset_state_stage import install_strategy_research_asset_state_stage\n\ninstall_strategy_research_asset_state_stage()\n\n'''
          if active_hook not in text:
              raise SystemExit('Active Asset State Clustering startup hook not found.')
          main.write_text(text.replace(active_hook, '', 1), encoding='utf-8')

          compatibility = Path('src/market_cycle_trader_api/services/strategy_research_asset_state_stage.py')
          compatibility.write_text(
              '''from __future__ import annotations\n\n\ndef install_strategy_research_asset_state_stage() -> None:\n    """Legacy compatibility shim. Asset State Clustering is no longer an active Strategy Research stage."""\n    return None\n''',
              encoding='utf-8',
          )
          PY

      - name: Validate API v10.8.5
        shell: bash
        run: |
          set -euxo pipefail
          python -m compileall -q src/market_cycle_trader_api
          python - <<'PY'
          from pathlib import Path
          config = Path('src/market_cycle_trader_api/core/config.py').read_text(encoding='utf-8')
          pyproject = Path('pyproject.toml').read_text(encoding='utf-8')
          main = Path('src/market_cycle_trader_api/main.py').read_text(encoding='utf-8')
          hook = Path('src/market_cycle_trader_api/services/strategy_research_asset_state_stage.py').read_text(encoding='utf-8')
          temporal = Path('src/market_cycle_trader_api/services/temporal_intelligence.py').read_text(encoding='utf-8')
          assert 'API_VERSION = "10.8.5"' in config
          assert 'version = "10.8.5"' in pyproject
          assert 'install_strategy_research_asset_state_stage' not in main
          assert 'asset_state_clustering' not in main
          assert 'build_and_persist' not in hook
          assert 'ASSET_STATE_STAGE' not in hook
          assert '"reference", "temporal", "statistical_ml_control"' in temporal
          assert '"asset_state_clustering"' not in temporal
          assert 'obsolete_asset_state_failure' in temporal
          print('API v10.8.5 validation passed')
          PY

      - name: Commit API v10.8.5
        shell: bash
        run: |
          rm .github/workflows/apply-v10-8-5-disable-asset-state-stage.yml
          find src -type d -name __pycache__ -prune -exec rm -rf {} +
          find src -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: disable legacy asset-state clustering stage hook [v10.8.5 applied]"
          git push origin HEAD:fix/10.8.5-disable-asset-state-stage
