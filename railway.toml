[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = "python scripts/bootstrap_market_history.py && python scripts/bootstrap_parameters.py"
startCommand = "python -m uvicorn market_cycle_trader_api.main:app --app-dir src --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
